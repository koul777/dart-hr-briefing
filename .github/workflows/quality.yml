name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install project and quality tools
        run: python -m pip install -e ".[dev]"
      - name: Unit and contract tests
        run: python -m coverage run -m unittest discover -v
      - name: Coverage summary
        run: python -m coverage report -m --fail-under=80
      - name: Python lint
        run: ruff check .
      - name: Python compile check
        run: python -m py_compile analysis_contract.py server.py agent_orchestration.py workforce_analytics.py claude_mcp_adapter.py openai_responses_adapter.py orchestration_evaluation.py orchestrator.py runtime_controls.py tools/benchmark_orchestration.py tools/artifact_manifest.py
      - name: Frontend syntax check
        run: |
          node --check static/app.js
          node --check tools/qa_orchestration_v2.js
      - name: Deterministic orchestration budget
        run: python tools/benchmark_orchestration.py --iterations 25 --warmups 2 --max-p95-ms 250

  package-smoke:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and frozen build tools
        run: python -m pip install -e ".[build]"
      - name: Build isolated Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean `
            --distpath reports/ci-build/dist `
            --workpath reports/ci-build/work `
            DARTStructure.spec
      - name: Smoke packaged health and static assets
        shell: pwsh
        run: |
          python tools/packaged_runtime_smoke.py `
            --exe reports/ci-build/dist/DARTStructure.exe `
            --working-directory $env:RUNNER_TEMP `
            --port 8776 `
            --strict-schema `
            --health-only
      - uses: actions/upload-artifact@v4
        with:
          name: DARTStructure-windows
          path: reports/ci-build/dist/DARTStructure.exe
